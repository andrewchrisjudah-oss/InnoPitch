[theme]
base = "dark"
primaryColor = "#FF3D81"
backgroundColor = "#0B0B12"
secondaryBackgroundColor = "#171722"
textColor = "#F7F7FA"
borderColor = "#30303D"
showWidgetBorder = true
showSidebarBorder = true
baseRadius = "large"
buttonRadius = "full"
font = "'Inter':https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
headingFontWeights = [700, 700, 600, 600, 600, 600]

[theme.sidebar]
backgroundColor = "#11111A"
secondaryBackgroundColor = "#1D1D29"
textColor = "#F7F7FA"
primaryColor = "#FF3D81"
borderColor = "#30303D"
